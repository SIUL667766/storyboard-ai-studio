<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storyboard AI Studio</title>
<style>
  :root {
    --bg: #0e1014;
    --panel: #161a21;
    --panel2: #1d222b;
    --border: #2a3140;
    --border2: #3a4356;
    --text: #e8ebf2;
    --muted: #8b94a7;
    --accent: #ff7a2f;
    --accent-ink: #1a0d04;
    --danger: #ff6b73;
    --ok: #3dd68c;
    --chip: #242b37;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    min-height: 100vh;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(14,16,20,.94); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .topbar-row {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 10px 16px;
  }
  .topbar-row + .topbar-row {
    padding-top: 0; padding-bottom: 12px;
    border-top: none;
  }
  .brand {
    display: flex; align-items: center; gap: 8px;
    font-weight: 800; letter-spacing: -.02em; white-space: nowrap;
  }
  .brand-mark {
    width: 28px; height: 28px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #ffb347);
    display: grid; place-items: center; color: var(--accent-ink);
    font-size: 14px; font-weight: 900;
  }
  .field-inline {
    background: #12151b; border: 1px solid var(--border); color: var(--text);
    padding: 7px 10px; border-radius: 8px; outline: none;
  }
  .field-inline:focus { border-color: var(--accent); }
  #projectTitle { flex: 1; min-width: 160px; max-width: 320px; font-weight: 700; }
  .btn {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    padding: 7px 12px; border-radius: 8px; font-weight: 650;
    transition: .15s background, .15s border-color;
  }
  .btn:hover { background: #242b37; border-color: var(--border2); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary {
    background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
  }
  .btn-primary:hover { background: #ff8d4d; border-color: #ff8d4d; }
  .btn-danger:hover { background: #3a1c1f; border-color: #7a2b30; color: #ff9a9f; }
  .btn-ghost { background: transparent; }
  .spacer { flex: 1; min-width: 8px; }
  .totals {
    color: var(--muted); font-size: 13px; font-weight: 600;
    padding: 6px 10px; border-radius: 8px; background: #12151b;
    border: 1px solid var(--border);
  }
  main { max-width: 1600px; margin: 0 auto; padding: 18px 16px 110px; }
  .section {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px; margin-bottom: 18px;
  }
  .section-head {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    margin-bottom: 12px;
  }
  .section-head h2 {
    margin: 0; font-size: 15px; font-weight: 800; letter-spacing: .02em;
    text-transform: uppercase; color: var(--muted);
  }
  .char-form {
    display: grid; gap: 8px;
    grid-template-columns: 1.1fr 1.6fr .7fr auto;
    align-items: end;
  }
  @media (max-width: 820px) {
    .char-form { grid-template-columns: 1fr 1fr; }
  }
  .fld { display: flex; flex-direction: column; gap: 4px; }
  .fld > span {
    font-size: 10px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .06em; font-weight: 700;
  }
  .fld input, .fld textarea, .fld select {
    background: #12151b; border: 1px solid var(--border); color: var(--text);
    padding: 8px 10px; border-radius: 8px; outline: none; width: 100%;
  }
  .fld textarea { resize: vertical; min-height: 52px; }
  .fld input:focus, .fld textarea:focus, .fld select:focus { border-color: var(--accent); }
  .chars {
    display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px;
  }
  .char-card {
    display: flex; gap: 10px; align-items: center;
    background: var(--panel2); border: 1px solid var(--border);
    border-radius: 12px; padding: 8px 10px; min-width: 220px; max-width: 340px;
  }
  .char-card img, .avatar-ph {
    width: 48px; height: 48px; border-radius: 10px; object-fit: cover;
    background: #0e1014; border: 1px solid var(--border); flex-shrink: 0;
  }
  .avatar-ph { display: grid; place-items: center; color: var(--muted); font-size: 18px; }
  .char-meta { flex: 1; min-width: 0; }
  .char-meta strong { display: block; font-size: 13px; }
  .char-meta small { color: var(--muted); font-size: 11px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .char-actions { display: flex; gap: 2px; }
  .icon-btn {
    background: none; border: none; color: var(--muted);
    padding: 4px 6px; border-radius: 6px; font-size: 14px;
  }
  .icon-btn:hover { background: #2c3444; color: #fff; }
  .grid {
    display: grid; gap: 18px;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;
  }
  .panel.dragging { opacity: .55; }
  .panel-head {
    display: flex; align-items: center; gap: 6px;
    padding: 8px; background: var(--panel2); border-bottom: 1px solid var(--border);
  }
  .num {
    min-width: 26px; height: 26px; padding: 0 7px; border-radius: 7px;
    background: var(--accent); color: var(--accent-ink);
    font-weight: 800; font-size: 12px; display: grid; place-items: center;
    cursor: grab;
  }
  .panel-actions { margin-left: auto; display: flex; gap: 2px; }
  .canvas-wrap {
    position: relative; background: #0a0c10; line-height: 0;
    border-bottom: 1px solid var(--border);
  }
  .canvas-wrap canvas {
    display: block; width: 100%; height: auto;
    touch-action: none; cursor: crosshair; background: #111;
  }
  .canvas-busy {
    position: absolute; inset: 0; display: none; place-items: center;
    background: rgba(8,10,14,.55); color: #fff; font-weight: 700; font-size: 13px;
  }
  .canvas-busy.show { display: grid; }
  .panel-body { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; min-width: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 28px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--chip); border: 1px solid var(--border);
    border-radius: 999px; padding: 3px 8px 3px 3px; font-size: 12px; font-weight: 650;
    cursor: pointer; user-select: none;
  }
  .chip img, .chip .dot {
    width: 20px; height: 20px; border-radius: 50%; object-fit: cover;
  }
  .chip .dot { background: #556; display: inline-block; }
  .chip.on { border-color: var(--accent); background: #2a2118; color: #ffd7b8; }
  .chip.muted { opacity: .55; }
  .gen-row { display: flex; gap: 8px; align-items: center; }
  .gen-row .btn { flex: 1; }
  .hint { font-size: 11px; color: var(--muted); }
  .fab {
    position: fixed; bottom: 24px; right: 24px; z-index: 40;
    background: var(--accent); color: var(--accent-ink); border: none;
    padding: 14px 22px; border-radius: 100px; font-weight: 800;
    box-shadow: 0 8px 28px rgba(255,122,47,.4);
  }
  .fab:hover { background: #ff8d4d; }
  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translate(-50%, 140%);
    background: #232a36; border: 1px solid var(--border2); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 600;
    z-index: 100; transition: .35s transform, .35s opacity; max-width: 90vw; text-align: center;
    opacity: 0; pointer-events: none;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  .empty {
    color: var(--muted); font-size: 13px; padding: 8px 2px;
  }
  @media print {
    body { background: #fff; color: #000; }
    .topbar, .fab, .toast, .panel-actions, .char-form, .section-head .btn,
    .gen-row, .icon-btn, #charsSection .char-actions { display: none !important; }
    main { padding: 0; max-width: none; }
    .section { border: none; padding: 0; margin: 0 0 12px; background: transparent; }
    #charsSection { display: none !important; }
    .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .panel { break-inside: avoid; border: 1.5px solid #000; border-radius: 6px; background: #fff; }
    .panel-head { background: #fff; border-bottom: 1px solid #000; }
    .num { background: #000; color: #fff; }
    .panel-body { padding: 6px; }
    .fld > span { color: #555; }
    .fld input, .fld textarea, .fld select {
      background: #fff; color: #000; border-color: #ccc;
    }
    .chip { border-color: #999; color: #000; background: #f3f3f3; }
    .canvas-wrap { border-bottom: 1px solid #000; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-row">
    <div class="brand"><span class="brand-mark">SB</span> Storyboard AI Studio</div>
    <input class="field-inline" id="projectTitle" value="Mi storyboard" spellcheck="false" placeholder="Título del proyecto">
    <select class="field-inline" id="aspect" title="Formato">
      <option value="16:9" selected>16:9</option>
      <option value="4:3">4:3</option>
      <option value="1:1">1:1</option>
      <option value="9:16">9:16</option>
    </select>
    <select class="field-inline" id="style" title="Estilo visual">
      <option value="cinematic">Cinematic</option>
      <option value="anime">Anime</option>
      <option value="comic">Comic</option>
      <option value="watercolor">Watercolor</option>
      <option value="3d">3D</option>
      <option value="noir">Noir</option>
    </select>
    <div class="spacer"></div>
    <button class="btn" id="btnPrint" type="button">Imprimir</button>
    <button class="btn" id="btnSave" type="button">Guardar</button>
    <button class="btn" id="btnOpen" type="button">Abrir</button>
    <input type="file" id="fileOpen" accept="application/json,.json" hidden>
  </div>
  <div class="topbar-row">
    <button class="btn btn-primary" id="btnGenAll" type="button">Generar todo el storyboard</button>
    <span class="totals" id="totals">0 paneles · 0 s</span>
    <div class="spacer"></div>
    <button class="btn btn-danger" id="btnClear" type="button">Vaciar todo</button>
  </div>
</header>

<main>
  <section class="section" id="charsSection">
    <div class="section-head">
      <h2>Personajes</h2>
      <span class="hint">Se usan como chips en cada panel y en el prompt de imagen (seed fija = consistencia).</span>
    </div>
    <div class="char-form">
      <label class="fld"><span>Nombre</span><input id="charName" placeholder="Ej. Piloto" maxlength="40"></label>
      <label class="fld"><span>Descripción visual</span><input id="charDesc" placeholder="rasgos, ropa, colores…" maxlength="220"></label>
      <label class="fld"><span>Seed</span><input id="charSeed" type="number" placeholder="auto"></label>
      <button class="btn btn-primary" id="btnAddChar" type="button">+ Personaje</button>
    </div>
    <div class="chars" id="charsList"></div>
  </section>

  <section class="section" style="background:transparent;border:none;padding:0">
    <div class="section-head" style="margin-bottom:14px">
      <h2>Paneles</h2>
      <span class="hint">Dibuja anotaciones en rojo sobre la imagen · Ctrl+Z deshace</span>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<button class="fab" id="fabAdd" type="button">+ Añadir panel</button>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  "use strict";

  const STORAGE_KEY = "storyboardAI.v1";
  const RATIOS = { "16:9": 16/9, "4:3": 4/3, "1:1": 1, "9:16": 9/16 };
  const STYLE_PROMPTS = {
    cinematic: "cinematic film still, dramatic lighting, shallow depth of field, 35mm",
    anime: "anime style, clean lineart, vibrant colors, studio ghibli influenced",
    comic: "comic book panel, bold ink outlines, halftone shading, dynamic composition",
    watercolor: "watercolor illustration, soft washes, paper texture, delicate edges",
    "3d": "3D render, octane, subsurface scattering, detailed materials, soft studio light",
    noir: "film noir, high contrast black and white, dramatic shadows, moody atmosphere"
  };
  const SHOTS = [
    "Plano general","Plano entero","Plano americano","Plano medio",
    "Primer plano","Primerísimo primer plano","Plano detalle","Plano subjetivo",
    "Plano secuencia","Picado","Contrapicado","Cenital","Otro"
  ];

  const $ = (s, r=document) => r.querySelector(s);
  const $$ = (s, r=document) => [...r.querySelectorAll(s)];

  const state = {
    title: "Mi storyboard",
    aspect: "16:9",
    style: "cinematic",
    characters: [],
    panels: []
  };

  let seqChar = 0;
  let seqPanel = 0;
  let activeCanvas = null;
  let dragEl = null;
  let saveTimer = null;

  function newCharId() { return "c" + (++seqChar); }
  function newPanelId() { return "p" + (++seqPanel); }

  function dims(aspect) {
    const r = RATIOS[aspect] || 16/9;
    const long = 1024;
    return r >= 1
      ? { w: long, h: Math.max(64, Math.round(long / r)) }
      : { w: Math.max(64, Math.round(long * r)), h: long };
  }

  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._tm);
    t._tm = setTimeout(() => t.classList.remove("show"), 2800);
  }

  function pollinationsURL(prompt, { width, height, seed, model = "flux" } = {}) {
    const base = "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt);
    const q = new URLSearchParams();
    if (width) q.set("width", String(width));
    if (height) q.set("height", String(height));
    if (seed != null && seed !== "") q.set("seed", String(seed));
    q.set("nologo", "true");
    q.set("model", model);
    return base + "?" + q.toString();
  }

  function portraitPrompt(ch) {
    return `character portrait, head and shoulders, consistent character design, ${ch.name}, ${ch.desc || "distinctive look"}, neutral background, high detail`;
  }

  function panelPrompt(panel) {
    const style = STYLE_PROMPTS[state.style] || STYLE_PROMPTS.cinematic;
    const chars = (panel.characterIds || [])
      .map(id => state.characters.find(c => c.id === id))
      .filter(Boolean)
      .map(c => `${c.name} (${c.desc || "character"})`)
      .join(", ");
    const parts = [
      style,
      panel.shot ? `shot type: ${panel.shot}` : "",
      chars ? `featuring characters: ${chars}` : "",
      panel.action || "storyboard panel",
      panel.dialogue ? `dialogue mood: "${panel.dialogue}"` : "",
      "storyboard frame, coherent composition, no watermark, no text overlay"
    ].filter(Boolean);
    return parts.join(", ");
  }

  function updateTotals() {
    const n = state.panels.length;
    const secs = state.panels.reduce((a, p) => a + (parseFloat(p.duration) || 0), 0);
    const s = Number.isInteger(secs) ? String(secs) : secs.toFixed(1).replace(/\.0$/, "");
    $("#totals").textContent = `${n} panel${n === 1 ? "" : "es"} · ${s} s`;
  }

  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persist, 500);
  }

  function serialize() {
    return {
      version: 1,
      title: state.title,
      aspect: state.aspect,
      style: state.style,
      characters: state.characters.map(c => ({
        id: c.id, name: c.name, desc: c.desc, seed: c.seed, avatar: c.avatar || ""
      })),
      panels: state.panels.map(p => {
        const card = document.querySelector(`.panel[data-id="${p.id}"]`);
        let img = p.img || "";
        try {
          if (card) {
            const c = card.querySelector("canvas");
            if (c) img = c.toDataURL("image/jpeg", 0.82);
          }
        } catch (_) {}
        return {
          id: p.id,
          action: p.action || "",
          dialogue: p.dialogue || "",
          shot: p.shot || SHOTS[0],
          duration: p.duration ?? "",
          characterIds: [...(p.characterIds || [])],
          seed: p.seed ?? null,
          img
        };
      })
    };
  }

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(serialize()));
    } catch (e) {
      toast("No se pudo guardar en localStorage (¿muy grande?)");
    }
  }

  function pushHistory(canvas) {
    const h = canvas._hist || (canvas._hist = []);
    try { h.push(canvas.toDataURL("image/png")); } catch (_) {}
    if (h.length > 20) h.shift();
  }

  function undoCanvas(canvas) {
    if (!canvas) { toast("Selecciona un panel (dibuja o genera)"); return; }
    const h = canvas._hist;
    if (!h || !h.length) { toast("Nada que deshacer"); return; }
    const url = h.pop();
    const img = new Image();
    img.onload = () => {
      const ctx = canvas.getContext("2d");
      ctx.setTransform(1,0,0,1,0,0);
      ctx.globalCompositeOperation = "source-over";
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      scheduleSave();
    };
    img.src = url;
  }

  function attachDrawing(canvas) {
    const ctx = canvas.getContext("2d");
    let drawing = false, lx = 0, ly = 0;

    const pos = e => {
      const r = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - r.left) * (canvas.width / r.width),
        y: (e.clientY - r.top) * (canvas.height / r.height)
      };
    };

    canvas.addEventListener("pointerdown", e => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      e.preventDefault();
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
      activeCanvas = canvas;
      pushHistory(canvas);
      drawing = true;
      const p = pos(e);
      lx = p.x; ly = p.y;
      ctx.globalCompositeOperation = "source-over";
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#e5484d";
      ctx.lineWidth = Math.max(3, Math.round(canvas.width / 280));
      ctx.beginPath();
      ctx.moveTo(lx, ly);
      ctx.lineTo(lx + 0.01, ly);
      ctx.stroke();
    });

    canvas.addEventListener("pointermove", e => {
      if (!drawing) return;
      e.preventDefault();
      const p = pos(e);
      ctx.beginPath();
      ctx.moveTo(lx, ly);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      lx = p.x; ly = p.y;
    });

    const stop = e => {
      if (!drawing) return;
      drawing = false;
      scheduleSave();
      try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
    };
    canvas.addEventListener("pointerup", stop);
    canvas.addEventListener("pointercancel", stop);
  }

  function makeCanvas(aspect, dataUrl) {
    const { w, h } = dims(aspect);
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#1a1d24";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#5a6272";
    ctx.font = `600 ${Math.round(w/28)}px system-ui,sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("Sin imagen — Generar imagen", w/2, h/2);
    attachDrawing(c);
    if (dataUrl) {
      const img = new Image();
      img.onload = () => {
        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
      };
      img.src = dataUrl;
    }
    return c;
  }

  function loadImageOntoCanvas(canvas, url, { pushHist = true } = {}) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        if (pushHist) pushHistory(canvas);
        const ctx = canvas.getContext("2d");
        ctx.setTransform(1,0,0,1,0,0);
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        // cover fit
        const scale = Math.max(canvas.width / img.width, canvas.height / img.height);
        const dw = img.width * scale, dh = img.height * scale;
        ctx.drawImage(img, (canvas.width - dw) / 2, (canvas.height - dh) / 2, dw, dh);
        resolve();
      };
      img.onerror = () => reject(new Error("No se pudo cargar la imagen"));
      img.src = url.startsWith("data:") ? url : (url + (url.includes("?") ? "&" : "?") + "_t=" + Date.now());
    });
  }

  function renderChars() {
    const box = $("#charsList");
    box.innerHTML = "";
    if (!state.characters.length) {
      box.innerHTML = `<div class="empty">Aún no hay personajes. Añade uno para usarlo en los paneles.</div>`;
      return;
    }
    state.characters.forEach(ch => {
      const el = document.createElement("div");
      el.className = "char-card";
      el.dataset.id = ch.id;
      const avatar = ch.avatar
        ? `<img src="${ch.avatar}" alt="">`
        : `<div class="avatar-ph">👤</div>`;
      el.innerHTML = `
        ${avatar}
        <div class="char-meta">
          <strong></strong>
          <small></small>
        </div>
        <div class="char-actions">
          <button class="icon-btn" data-act="regen" title="Regenerar avatar">↻</button>
          <button class="icon-btn" data-act="del" title="Eliminar">✕</button>
        </div>`;
      el.querySelector("strong").textContent = ch.name;
      el.querySelector("small").textContent = (ch.desc || "sin descripción") + " · seed " + ch.seed;
      el.querySelector('[data-act="del"]').addEventListener("click", () => {
        state.characters = state.characters.filter(c => c.id !== ch.id);
        state.panels.forEach(p => {
          p.characterIds = (p.characterIds || []).filter(id => id !== ch.id);
        });
        renderChars();
        renderAllPanelsChips();
        scheduleSave();
      });
      el.querySelector('[data-act="regen"]').addEventListener("click", async () => {
        await refreshCharAvatar(ch, true);
        renderChars();
        renderAllPanelsChips();
        scheduleSave();
      });
      box.appendChild(el);
    });
  }

  async function refreshCharAvatar(ch, forceNewSeed) {
    if (forceNewSeed) ch.seed = Math.floor(Math.random() * 1e9);
    const { w, h } = { w: 256, h: 256 };
    const url = pollinationsURL(portraitPrompt(ch), { width: w, height: h, seed: ch.seed });
    ch.avatar = url;
    // warm-load
    await new Promise(res => {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = img.onerror = () => res();
      img.src = url;
    });
  }

  function panelChipsHTML(panel) {
    if (!state.characters.length) {
      return `<span class="hint">Añade personajes arriba para asignarlos</span>`;
    }
    return state.characters.map(ch => {
      const on = (panel.characterIds || []).includes(ch.id);
      const av = ch.avatar
        ? `<img src="${ch.avatar}" alt="">`
        : `<span class="dot"></span>`;
      return `<button type="button" class="chip ${on ? "on" : "muted"}" data-cid="${ch.id}">${av}<span></span></button>`;
    }).join("");
  }

  function bindChips(card, panel) {
    const wrap = card.querySelector(".chips");
    wrap.innerHTML = panelChipsHTML(panel);
    wrap.querySelectorAll(".chip").forEach(chip => {
      const name = state.characters.find(c => c.id === chip.dataset.cid)?.name || "";
      chip.querySelector("span").textContent = name;
      chip.addEventListener("click", () => {
        const id = chip.dataset.cid;
        const set = new Set(panel.characterIds || []);
        if (set.has(id)) set.delete(id); else set.add(id);
        panel.characterIds = [...set];
        bindChips(card, panel);
        scheduleSave();
      });
    });
  }

  function renderAllPanelsChips() {
    $$(".panel").forEach(card => {
      const panel = state.panels.find(p => p.id === card.dataset.id);
      if (panel) bindChips(card, panel);
    });
  }

  function createPanelCard(panel) {
    const card = document.createElement("div");
    card.className = "panel";
    card.dataset.id = panel.id;
    const shotOpts = SHOTS.map(s => `<option value="${s}" ${s === panel.shot ? "selected" : ""}>${s}</option>`).join("");
    card.innerHTML = `
      <div class="panel-head">
        <span class="num">1</span>
        <div class="panel-actions">
          <button class="icon-btn" data-act="left" title="Mover izquierda">◀</button>
          <button class="icon-btn" data-act="right" title="Mover derecha">▶</button>
          <button class="icon-btn" data-act="dup" title="Duplicar">⧉</button>
          <button class="icon-btn" data-act="del" title="Eliminar">✕</button>
        </div>
      </div>
      <div class="canvas-wrap">
        <div class="canvas-busy">Generando…</div>
      </div>
      <div class="panel-body">
        <label class="fld"><span>Acción / Descripción</span>
          <textarea class="f-action" placeholder="¿Qué ocurre en este plano?"></textarea>
        </label>
        <div class="fld"><span>Personajes en el plano</span>
          <div class="chips"></div>
        </div>
        <div class="row">
          <label class="fld"><span>Tipo de plano</span>
            <select class="f-shot">${shotOpts}</select>
          </label>
          <label class="fld"><span>Dur. (s)</span>
            <input class="f-duration" type="number" min="0" step="0.5" placeholder="0">
          </label>
        </div>
        <label class="fld"><span>Diálogo / Sonido</span>
          <input class="f-dialogue" type="text" placeholder="—">
        </label>
        <div class="gen-row">
          <button class="btn btn-primary f-gen" type="button">Generar imagen</button>
        </div>
      </div>`;

    const canvas = makeCanvas(state.aspect, panel.img || "");
    card.querySelector(".canvas-wrap").insertBefore(canvas, card.querySelector(".canvas-busy"));

    const fAction = card.querySelector(".f-action");
    const fDialogue = card.querySelector(".f-dialogue");
    const fShot = card.querySelector(".f-shot");
    const fDuration = card.querySelector(".f-duration");
    fAction.value = panel.action || "";
    fDialogue.value = panel.dialogue || "";
    fShot.value = panel.shot || SHOTS[0];
    if (panel.duration != null && panel.duration !== "") fDuration.value = panel.duration;

    const sync = () => {
      panel.action = fAction.value;
      panel.dialogue = fDialogue.value;
      panel.shot = fShot.value;
      panel.duration = fDuration.value;
      updateTotals();
      scheduleSave();
    };
    [fAction, fDialogue, fShot, fDuration].forEach(el => {
      el.addEventListener("input", sync);
      el.addEventListener("change", sync);
    });

    bindChips(card, panel);

    card.querySelector(".f-gen").addEventListener("click", () => generatePanelImage(panel, card));

    card.querySelectorAll(".icon-btn").forEach(btn => {
      btn.addEventListener("click", e => {
        e.stopPropagation();
        const act = btn.dataset.act;
        const idx = state.panels.findIndex(p => p.id === panel.id);
        if (act === "del") {
          state.panels.splice(idx, 1);
          card.remove();
          renumber(); updateTotals(); scheduleSave();
        } else if (act === "dup") {
          // flush canvas to data
          try { panel.img = canvas.toDataURL("image/jpeg", 0.82); } catch (_) {}
          const clone = {
            id: newPanelId(),
            action: panel.action,
            dialogue: panel.dialogue,
            shot: panel.shot,
            duration: panel.duration,
            characterIds: [...(panel.characterIds || [])],
            seed: Math.floor(Math.random() * 1e9),
            img: panel.img || ""
          };
          state.panels.splice(idx + 1, 0, clone);
          const cloneCard = createPanelCard(clone);
          card.after(cloneCard);
          renumber(); updateTotals(); scheduleSave();
        } else if (act === "left" && idx > 0) {
          const tmp = state.panels[idx - 1];
          state.panels[idx - 1] = state.panels[idx];
          state.panels[idx] = tmp;
          const prev = card.previousElementSibling;
          if (prev) $("#grid").insertBefore(card, prev);
          renumber(); scheduleSave();
        } else if (act === "right" && idx < state.panels.length - 1) {
          const tmp = state.panels[idx + 1];
          state.panels[idx + 1] = state.panels[idx];
          state.panels[idx] = tmp;
          const next = card.nextElementSibling;
          if (next) $("#grid").insertBefore(next, card);
          renumber(); scheduleSave();
        }
      });
    });

    const handle = card.querySelector(".num");
    handle.addEventListener("mousedown", () => { card.draggable = true; });
    card.addEventListener("dragstart", e => {
      dragEl = card;
      card.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
    });
    card.addEventListener("dragend", () => {
      card.classList.remove("dragging");
      card.draggable = false;
      dragEl = null;
      // reorder state from DOM
      const ids = $("#grid").querySelectorAll(".panel");
      const ordered = [...ids].map(el => el.dataset.id);
      state.panels.sort((a, b) => ordered.indexOf(a.id) - ordered.indexOf(b.id));
      renumber(); scheduleSave();
    });

    canvas.addEventListener("pointerdown", () => { activeCanvas = canvas; });

    return card;
  }

  function renumber() {
    $$(".panel").forEach((card, i) => {
      card.querySelector(".num").textContent = String(i + 1);
    });
  }

  async function generatePanelImage(panel, card) {
    syncPanelFromCard(panel, card);
    if (!panel.action && !(panel.characterIds || []).length) {
      toast("Escribe una acción o asigna personajes");
      return;
    }
    const busy = card.querySelector(".canvas-busy");
    const canvas = card.querySelector("canvas");
    const btn = card.querySelector(".f-gen");
    busy.classList.add("show");
    btn.disabled = true;
    try {
      if (panel.seed == null) panel.seed = Math.floor(Math.random() * 1e9);
      const { w, h } = dims(state.aspect);
      // prefer character seed when exactly one character selected
      let seed = panel.seed;
      const selected = (panel.characterIds || [])
        .map(id => state.characters.find(c => c.id === id))
        .filter(Boolean);
      if (selected.length === 1) seed = selected[0].seed;
      const url = pollinationsURL(panelPrompt(panel), { width: w, height: h, seed });
      await loadImageOntoCanvas(canvas, url);
      try { panel.img = canvas.toDataURL("image/jpeg", 0.82); } catch (_) { panel.img = url; }
      activeCanvas = canvas;
      scheduleSave();
      toast("Imagen generada ✔");
    } catch (err) {
      toast("Error al generar imagen");
      console.error(err);
    } finally {
      busy.classList.remove("show");
      btn.disabled = false;
    }
  }

  function syncPanelFromCard(panel, card) {
    panel.action = card.querySelector(".f-action").value;
    panel.dialogue = card.querySelector(".f-dialogue").value;
    panel.shot = card.querySelector(".f-shot").value;
    panel.duration = card.querySelector(".f-duration").value;
  }

  async function generateAll() {
    if (!state.panels.length) { toast("No hay paneles"); return; }
    const btn = $("#btnGenAll");
    btn.disabled = true;
    toast("Generando storyboard…");
    try {
      for (const panel of state.panels) {
        const card = document.querySelector(`.panel[data-id="${panel.id}"]`);
        if (!card) continue;
        await generatePanelImage(panel, card);
      }
      toast("Storyboard completo ✔");
    } finally {
      btn.disabled = false;
    }
  }

  function addPanel(scroll) {
    const panel = {
      id: newPanelId(),
      action: "",
      dialogue: "",
      shot: SHOTS[0],
      duration: "",
      characterIds: [],
      seed: Math.floor(Math.random() * 1e9),
      img: ""
    };
    state.panels.push(panel);
    const card = createPanelCard(panel);
    $("#grid").appendChild(card);
    renumber(); updateTotals(); scheduleSave();
    if (scroll) card.scrollIntoView({ behavior: "smooth", block: "center" });
    return card;
  }

  function rebuildUI() {
    $("#projectTitle").value = state.title;
    $("#aspect").value = state.aspect;
    $("#style").value = state.style;
    renderChars();
    const grid = $("#grid");
    grid.innerHTML = "";
    state.panels.forEach(p => grid.appendChild(createPanelCard(p)));
    renumber();
    updateTotals();
  }

  function loadProject(data) {
    if (!data || typeof data !== "object") throw new Error("JSON inválido");
    state.title = data.title || "Mi storyboard";
    state.aspect = RATIOS[data.aspect] ? data.aspect : "16:9";
    state.style = STYLE_PROMPTS[data.style] ? data.style : "cinematic";
    state.characters = Array.isArray(data.characters) ? data.characters.map(c => ({
      id: c.id || newCharId(),
      name: c.name || "Personaje",
      desc: c.desc || "",
      seed: c.seed != null ? c.seed : Math.floor(Math.random() * 1e9),
      avatar: c.avatar || ""
    })) : [];
    state.panels = Array.isArray(data.panels) ? data.panels.map(p => ({
      id: p.id || newPanelId(),
      action: p.action || "",
      dialogue: p.dialogue || "",
      shot: p.shot || SHOTS[0],
      duration: p.duration ?? "",
      characterIds: Array.isArray(p.characterIds) ? p.characterIds : [],
      seed: p.seed ?? Math.floor(Math.random() * 1e9),
      img: p.img || ""
    })) : [];
    // bump seq counters
    state.characters.forEach(c => {
      const n = parseInt(String(c.id).replace(/\D/g, ""), 10);
      if (!isNaN(n) && n > seqChar) seqChar = n;
    });
    state.panels.forEach(p => {
      const n = parseInt(String(p.id).replace(/\D/g, ""), 10);
      if (!isNaN(n) && n > seqPanel) seqPanel = n;
    });
    rebuildUI();
  }

  function downloadJSON() {
    // flush canvases
    const data = serialize();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (state.title || "storyboard").replace(/[^\w\u00C0-\u024F\- ]+/g, "").trim().replace(/\s+/g, "_") + ".json";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1200);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (_) {}
    toast("Proyecto guardado ✔");
  }

  // --- events ---
  $("#projectTitle").addEventListener("input", e => {
    state.title = e.target.value;
    scheduleSave();
  });

  $("#aspect").addEventListener("change", e => {
    state.aspect = e.target.value;
    // resize canvases preserving content
    $$(".panel").forEach(card => {
      const panel = state.panels.find(p => p.id === card.dataset.id);
      const oldC = card.querySelector("canvas");
      let dataUrl = "";
      try { dataUrl = oldC.toDataURL("image/jpeg", 0.85); } catch (_) { dataUrl = panel?.img || ""; }
      const newC = makeCanvas(state.aspect, dataUrl);
      oldC.replaceWith(newC);
      if (panel) panel.img = dataUrl;
    });
    scheduleSave();
  });

  $("#style").addEventListener("change", e => {
    state.style = e.target.value;
    scheduleSave();
  });

  $("#btnPrint").addEventListener("click", () => window.print());
  $("#btnSave").addEventListener("click", downloadJSON);
  $("#btnOpen").addEventListener("click", () => $("#fileOpen").click());
  $("#fileOpen").addEventListener("change", async e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    try {
      const text = await file.text();
      loadProject(JSON.parse(text));
      persist();
      toast("Proyecto abierto ✔");
    } catch (err) {
      toast("No se pudo abrir el JSON");
      console.error(err);
    }
  });

  $("#btnGenAll").addEventListener("click", generateAll);
  $("#btnClear").addEventListener("click", () => {
    if (!state.panels.length && !state.characters.length) return;
    if (!confirm("¿Vaciar todo el storyboard y los personajes?")) return;
    state.panels = [];
    state.characters = [];
    $("#grid").innerHTML = "";
    renderChars();
    addPanel(false);
    addPanel(false);
    addPanel(false);
    addPanel(false);
    persist();
    toast("Storyboard vaciado");
  });

  $("#btnAddChar").addEventListener("click", async () => {
    const name = ($("#charName").value || "").trim();
    const desc = ($("#charDesc").value || "").trim();
    let seed = ($("#charSeed").value || "").trim();
    if (!name) { toast("Pon un nombre al personaje"); return; }
    seed = seed === "" ? Math.floor(Math.random() * 1e9) : parseInt(seed, 10);
    if (isNaN(seed)) seed = Math.floor(Math.random() * 1e9);
    const ch = { id: newCharId(), name, desc, seed, avatar: "" };
    state.characters.push(ch);
    $("#charName").value = "";
    $("#charDesc").value = "";
    $("#charSeed").value = "";
    renderChars();
    renderAllPanelsChips();
    scheduleSave();
    toast("Generando avatar…");
    try {
      await refreshCharAvatar(ch, false);
      renderChars();
      renderAllPanelsChips();
      scheduleSave();
      toast(`Personaje «${name}» listo`);
    } catch (_) {
      toast("Avatar pendiente (se reintentará al regenerar)");
    }
  });

  $("#fabAdd").addEventListener("click", () => addPanel(true));

  document.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
      const tag = (e.target && e.target.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      e.preventDefault();
      undoCanvas(activeCanvas);
    }
  });

  const grid = $("#grid");
  grid.addEventListener("dragover", e => {
    if (!dragEl) return;
    e.preventDefault();
    const target = e.target.closest(".panel");
    if (!target || target === dragEl) return;
    const r = target.getBoundingClientRect();
    const before = e.clientX < r.left + r.width / 2;
    grid.insertBefore(dragEl, before ? target : target.nextSibling);
    renumber();
  });
  grid.addEventListener("drop", e => e.preventDefault());

  // init
  (function init() {
    let loaded = false;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        if (data && (Array.isArray(data.panels) || Array.isArray(data.characters))) {
          loadProject(data);
          loaded = true;
        }
      }
    } catch (_) {}
    if (!loaded) {
      for (let i = 0; i < 4; i++) addPanel(false);
      persist();
    }
    window.addEventListener("beforeunload", persist);
  })();
})();
</script>
</body>
</html>
