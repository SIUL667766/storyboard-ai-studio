<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff7a2f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Storyboard">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.svg">
<link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
<title>Storyboard AI Studio</title>
</head>
<body style="margin:0;background:#0e1014;color:#e8ebf2;font-family:system-ui;display:grid;place-items:center;min-height:100vh">
<p id="msg">Cargando Storyboard AI Studio…</p>
<script>
(async () => {
  try {
    const fetchText = (u) => fetch(u, {cache:"no-cache"}).then(r => {
      if (!r.ok) throw new Error("HTTP " + r.status + " " + u);
      return r.text();
    });
    const [t0, t1, t2, ha, hb] = await Promise.all([
      fetchText("./app.0.b64"),
      fetchText("./app.1.b64"),
      fetchText("./app.2.b64"),
      fetchText("./app.3a.hex"),
      fetchText("./app.3b.hex")
    ]);
    const hex = (ha + hb).replace(/\s+/g, "");
    let t3 = "";
    for (let i = 0; i < hex.length; i += 2) t3 += String.fromCharCode(parseInt(hex.substr(i, 2), 16));
    const b64 = [t0, t1, t2, t3].map(t => t.replace(/\s+/g, "")).join("");
    const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    if (typeof DecompressionStream === "undefined") throw new Error("Sin DecompressionStream");
    const html = await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    document.open(); document.write(html); document.close();
  } catch (err) {
    document.getElementById("msg").textContent = "Error: " + err.message;
  }
})();
</script>
</body>
</html>
